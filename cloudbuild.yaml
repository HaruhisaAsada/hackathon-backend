steps:
  - name: gcr.io/cloud-builders/docker
    dir: hackathon-backend
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/hackathon-backend:$SHORT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/hackathon-backend:$SHORT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - run
      - deploy
      - hackathon-backend
      - --image
      - gcr.io/$PROJECT_ID/hackathon-backend:$SHORT_SHA
      - --region
      - us-central1
      - --platform
      - managed
      - --quiet
images:
  - gcr.io/$PROJECT_ID/hackathon-backend:$SHORT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
